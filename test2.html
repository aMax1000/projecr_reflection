    class Line{
        coef;
        move;
        constructor(coef,move){
            this.coef=coef;
            this.move=move;
        }
        isover(x,y){
            return (x*this.coef+this.move>y)
        }
        isunder(x,y){
            return (x*this.coef+this.move<y)
        }
        intersection(line){
            co=(this.coef-line.coef);
            if(co){
            var x=(-this.move+line.move)/co;
            return [x,(x*this.coef+this.move)]
            }else{
                console.log("ERRROR PARALELING LINES")
            }
        }
    }
