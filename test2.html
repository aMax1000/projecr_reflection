    class Line{
        constructor(coef,move){
            this.coef=coef;
            this.move=move;
        }
        isover(x,y){
            return (x*this.coef+this.move>y)
        }
        isunder(x,y){
            return (x*this.coef+this.move<y)
        }
        intersection(line){
            co=(this.coef-line.coef);
            if(co){
            var x=(-this.move+line.move)/co;
            return [x,(x*this.coef+this.move)]
            }else{
                console.log("ERRROR PARALELING LINES")
            }
        }
        strprint(){
            return `coef: ${this.coef}\nmove: ${this.move} \n`
        }
    };

    class Secarr{
        constructor(){
            this.linearr=[];
            this.secup=[Number.MIN_SAFE_INTEGER,Number.MAX_SAFE_INTEGER];
        }
        addline(line,b=false){
            let i=0
            if(this.linearr.length!=0){
                while(i<this.linearr.length && line.coef<this.linearr[i]){
                        if (
                            !b && line.intersection(this.linearr[i])[0]<=this.secup[i+1] ||
                            b && line.intersection(this.linearr[i])[0]>=this.secup[i+1]
                        ){
                            this.secup[i+1]=line.intersection(this.linearr[i])[0];
                            i++
                            while(i<this.linearr.length){
                                check:{
                                    if(
                                        !b && line.coef<this.linearr[i] ||
                                        b && line.coef>this.linearr[i]
                                    ){   
                                        break check;
                                    }
                                    if (
                                        !b && line.intersection(this.linearr[i])[0]>this.secup[i+1] ||
                                        b && line.intersection(this.linearr[i])[0]<this.secup[i+1]
                                    ){
                                        this.secup.splice(i+1, 0,line.intersection(this.linearr[i])[0]);
                                        this.linearr.splice(i, 0,line);
                                        return
                                    }
                                }
                                delete this.linearr[i]
                                delete this.secup[i+1]
                            }
                        }
                        i++
                }
            }else{
                this.linearr[0]=line;
                console.log(1)
            }
        }


        strprint(){
            var a= `sec:${this.secup[0]}\n\n`
            for(let i=0;i<this.linearr.length;i++){
                a+=this.linearr[i].strprint();
                a+=`\nsec: ${this.secup[i+1]}\n\n`
            }
            if(this.linearr.length==0){
                a+=`sec: ${this.secup[1]}\n`
            }
            return a
        }
    }
